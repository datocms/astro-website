name: Code Quality Checks

on:
  pull_request:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
      FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
      SECRET_API_TOKEN: bogus
      FASTLY_KEY: bogus
      FASTLY_SERVICE_ID: bogus
      ROLLBAR_TOKEN: bogus
      PIPEDRIVE_TOKEN: bogus
      MAILERLITE_TOKEN: bogus
      RECAPTCHA_SECRET_KEY: bogus
      SLACK_TOKEN: bogus
      RECAPTCHA_KEY: bogus
      BASECAMP_ACCESS_TOKEN_PROVIDER_URL: bogus
      BASECAMP_ACCOUNT_ID: bogus
      BASECAMP_CLIENT_ID: bogus
      BASECAMP_CLIENT_SECRET: bogus
      BASECAMP_REFRESH_TOKEN: bogus
      BASECAMP_USER_AGENT: bogus
      FRONT_CHANNEL_URL_SALES: bogus
      FRONT_CHANNEL_URL_PARTNER_PROGRAM: bogus
      FRONT_CHANNEL_URL_SUPPORT: bogus
      OPENAI_API_KEY: bogus
      BASE64_SPAM_DETECTOR_PROMPT: bogus
      KNOWLEDGE_BASE_URL: https://knowledge.datocms.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
