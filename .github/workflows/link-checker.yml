# Finds site URLs (tracked sitemap sections plus CMS docs) that vanished without a
# redirect, and proposes redirects in a draft PR. The check uses no AI; the fix job, which alone holds
# the Anthropic key, runs only when something is broken.
name: Link checker

on:
  # A DatoCMS webhook starts a run when a doc page or group is published,
  # unpublished or deleted, and passes wait_seconds so a burst of edits settles
  # first. The concurrency group below keeps at most one run waiting.
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: Seconds to wait before checking
        type: number
        default: 0
      allow_mass_removal:
        description: Accept a removal larger than the per-section limit, once
        type: boolean
        default: false
  # Daily safety net, for missed webhooks and for URLs broken by code changes.
  # Minute 17: the top of the hour is when GitHub delays or drops scheduled runs.
  schedule:
    - cron: '17 6 * * *'

permissions: {}

concurrency:
  group: link-checker
  cancel-in-progress: false

env:
  SCRIPTS: .github/scripts/link-checker
  STATE: ${{ github.workspace }}/.link-checker/state.json
  BROKEN: ${{ github.workspace }}/.link-checker/broken.json

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To skip URLs already covered by an open checker PR or issue.
      pull-requests: read
      issues: read
    outputs:
      has_broken: ${{ steps.check.outputs.has_broken }}
    steps:
      - if: inputs.wait_seconds > 0
        run: sleep "$WAIT_SECONDS"
        env:
          WAIT_SECONDS: ${{ inputs.wait_seconds }}

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SCRIPTS }}/package-lock.json

      - run: npm ci
        working-directory: ${{ env.SCRIPTS }}

      # The previous run's state. Each run attempt saves a new cache entry; the
      # newest one matching the prefix is restored. v2: the state format changed.
      - uses: actions/cache/restore@v6
        with:
          path: .link-checker
          key: link-checker-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: link-checker-v2-

      - id: check
        run: mkdir -p .link-checker && node "$SCRIPTS/check.ts" --state "$STATE" --broken "$BROKEN"
        env:
          DATOCMS_API_TOKEN: ${{ secrets.DATOCMS_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_MASS_REMOVAL: ${{ inputs.allow_mass_removal }}

      - uses: actions/cache/save@v6
        with:
          path: .link-checker
          key: link-checker-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - if: steps.check.outputs.has_broken == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: link-checker
          path: .link-checker
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  fix:
    needs: check
    if: needs.check.outputs.has_broken == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ env.SCRIPTS }}/package-lock.json

      # The root install provides Prettier, to format astro.config.ts.
      - run: npm ci --ignore-scripts && npm ci --prefix "$SCRIPTS"

      - uses: actions/download-artifact@v8
        with:
          name: link-checker
          path: .link-checker

      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node "$SCRIPTS/fix.ts" --state "$STATE" --broken "$BROKEN"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
